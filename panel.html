<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TCM Admin Panel</title>
    <style>
        body {font-family:tahoma; padding:30px; background:#111; color:white;}
        input, textarea {width:100%; padding:10px; margin:10px 0; background:#222; border:1px solid #444; color:white;}
        button {padding:12px 20px; margin:10px 5px; cursor:pointer; background:#0066cc; color:white; border:none;}
        button:hover {background:#0055aa;}
        .rule {margin:15px 0; padding:15px; background:#1a1a1a;}
    </style>
</head>
<body>
    <h1>پنل مدیریت TCM 👑</h1>
    <div id="panel" style="display:none">

        <label>عنوان سایت</label>
        <input id="title">

        <label>IP سرور</label>
        <input id="ip">

        <label>توضیحات</label>
        <textarea id="description" rows="4"></textarea>

        <h3>قوانین</h3>
        <div id="rules-container"></div>
        <button id="add-rule">+ قانون جدید</button>

        <button id="save">ذخیره</button>
        <button id="logout">خروج</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxhXIVDhXNSisJ0v81ZtdjAZZt9vorNig",
            authDomain: "tcm-mc-173a6.firebaseapp.com",
            projectId: "tcm-mc-173a6",
            storageBucket: "tcm-mc-173a6.firebasestorage.app",
            messagingSenderId: "490709082172",
            appId: "1:490709082172:web:6ec840d278caef9112a339"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let rules = [];

        document.addEventListener("DOMContentLoaded", () => {
            const panel = document.getElementById("panel");

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.replace("admin.html");
                    return;
                }
                panel.style.display = "block";
                await loadData();
            });

            document.getElementById("add-rule").onclick = () => {
                rules.push({num: rules.length + 1, title: "", text: ""});
                renderRules();
            };

            document.getElementById("save").onclick = saveData;
            document.getElementById("logout").onclick = () => signOut(auth).then(() => window.location.replace("admin.html"));
        });

        async function loadData() {
            try {
                const snap = await getDoc(doc(db, "site", "info"));
                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById("title").value = data.title || "TCM MC";
                    document.getElementById("ip").value = data.ip || "Play.TCMMC.ir";
                    document.getElementById("description").value = data.description || "";
                    rules = data.rules || [];
                    renderRules();
                }
            } catch(e) { console.error(e); }
        }

        function renderRules() {
            const container = document.getElementById("rules-container");
            container.innerHTML = "";
            rules.forEach((r, i) => {
                const div = document.createElement("div");
                div.className = "rule";
                div.innerHTML = `
                    <input style="width:60px" value="\( {r.num}" onchange="rules[ \){i}].num = this.value">
                    <input placeholder="عنوان قانون" value="\( {r.title}" onchange="rules[ \){i}].title = this.value">
                    <textarea rows="3" placeholder="متن قانون" onchange="rules[\( {i}].text = this.value"> \){r.text}</textarea>
                    <button onclick="rules.splice(${i},1); renderRules()">حذف</button>
                `;
                container.appendChild(div);
            });
        }

        async function saveData() {
            try {
                await setDoc(doc(db, "site", "info"), {
                    title: document.getElementById("title").value,
                    ip: document.getElementById("ip").value,
                    description: document.getElementById("description").value,
                    rules: rules,
                    updated: new Date().toISOString()
                });
                alert("✅ ذخیره شد");
            } catch(e) {
                alert("خطا: " + e.message);
            }
        }
    </script>
</body>
</html>
