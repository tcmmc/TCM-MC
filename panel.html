<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<title>TCM Admin Panel</title>

<style>
body{
font-family:tahoma;
padding:30px;
background:#111;
color:white;
}

input,textarea{
width:100%;
padding:10px;
margin-top:10px;
}

button{
padding:12px;
margin-top:20px;
cursor:pointer;
}

</style>

</head>


<body>


<h1>پنل مدیریت TCM 👑</h1>


<div id="panel" style="display:none">


<label>عنوان سایت</label>
<input id="title">


<label>IP سرور</label>
<input id="ip">


<label>توضیحات</label>
<textarea id="description"></textarea>


<button id="save">
ذخیره
</button>


<button id="logout">
خروج
</button>


</div>



<script type="module">


import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";



const firebaseConfig = {

apiKey:"AIzaSyBxhXIVDhXNSisJ0v81ZtdjAZZt9vorNig",

authDomain:"tcm-mc-173a6.firebaseapp.com",

projectId:"tcm-mc-173a6",

storageBucket:"tcm-mc-173a6.firebasestorage.app",

messagingSenderId:"490709082172",

appId:"1:490709082172:web:6ec840d278caef9112a339"

};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);

const auth = getAuth(app);




// چک ورود

onAuthStateChanged(auth, async(user)=>{


if(!user){

window.location.href="admin.html";

return;

}



document.getElementById("panel").style.display="block";



// گرفتن اطلاعات قبلی

let snap = await getDoc(
doc(db,"site","info")
);



if(snap.exists()){


let data=snap.data();


title.value=data.title || "";

ip.value=data.ip || "";

description.value=data.description || "";


}



});





// ذخیره


save.onclick = async()=>{


try{


await setDoc(

doc(db,"site","info"),

{

title:title.value,

ip:ip.value,

description:description.value,

updated:new Date()

}

);



alert("✅ ذخیره شد");


}

catch(e){


alert(e.message);


}



};




// خروج


logout.onclick=()=>{


signOut(auth);


};



</script>


</body>

</html>
