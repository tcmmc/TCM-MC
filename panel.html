<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<title>TCM Admin Panel</title>

</head>


<body>


<h1>پنل مدیریت TCM 👑</h1>


<br>


<label>عنوان سایت</label>
<br>
<input id="title">


<br><br>


<label>IP سرور</label>
<br>
<input id="ip">


<br><br>


<label>توضیحات</label>
<br>
<textarea id="description"></textarea>


<br><br>


<button id="save">ذخیره</button>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import { 
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";




const firebaseConfig = {

apiKey: "AIzaSyBxhXIVDhXNSisJ0v81ZtdjAZZt9vorNig",

authDomain: "tcm-mc-173a6.firebaseapp.com",

projectId: "tcm-mc-173a6",

storageBucket: "tcm-mc-173a6.firebasestorage.app",

messagingSenderId: "490709082172",

appId: "1:490709082172:web:6ec840d278caef9112a339"

};




const app = initializeApp(firebaseConfig);


const db = getFirestore(app);


const auth = getAuth(app);




onAuthStateChanged(auth, async (user)=>{


if(!user){

alert("دسترسی ندارید!");

window.location.href="admin.html";

return;

}



// گرفتن اطلاعات قبلی

const snap = await getDoc(doc(db,"site","info"));


if(snap.exists()){


let data = snap.data();


document.getElementById("title").value = data.title || "";

document.getElementById("ip").value = data.ip || "";

document.getElementById("description").value = data.description || "";


}



});





document.getElementById("save").onclick = async ()=>{


const user = auth.currentUser;


if(!user){

alert("لطفا دوباره وارد شوید");

return;

}



await setDoc(

doc(db,"site","info"),

{


title:
document.getElementById("title").value,


ip:
document.getElementById("ip").value,


description:
document.getElementById("description").value



}


);



alert("ذخیره شد ✅");


};



</script>


</body>

</html>
