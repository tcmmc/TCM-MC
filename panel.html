<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TCM Admin Panel</title>

<style>

body{
    font-family:Tahoma;
    background:#111;
    color:white;
    padding:20px;
}

.box{
    max-width:500px;
    margin:auto;
    background:#222;
    padding:25px;
    border-radius:15px;
}

input,textarea{

width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:none;
font-size:16px;

}


button{

width:100%;
padding:14px;
background:#00c853;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


#status{

margin-top:15px;
text-align:center;

}

</style>

</head>


<body>


<div class="box">


<h1>👑 پنل مدیریت TCM</h1>


<input id="title" placeholder="عنوان سایت">


<input id="ip" placeholder="IP سرور">


<textarea id="description" placeholder="توضیحات سایت"></textarea>


<button id="save">

ذخیره اطلاعات

</button>


<div id="status"></div>


</div>




<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

getFirestore,
doc,
setDoc,
getDoc

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";




// تنظیمات فایربیس

const firebaseConfig = {


apiKey: "AIzaSyBxhXIVDhXNSisJ0v81ZtdjAZZt9vorNig",

authDomain: "tcm-mc-173a6.firebaseapp.com",

projectId: "tcm-mc-173a6",

storageBucket: "tcm-mc-173a6.firebasestorage.app",

messagingSenderId: "490709082172",

appId: "1:490709082172:web:6ec840d278caef9112a339"


};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);





// وقتی پنل باز شد اطلاعات قبلی رو بیاره

async function loadData(){


try{


const snap = await getDoc(
doc(db,"Site","info")
);



if(snap.exists()){


let data = snap.data();


document.getElementById("title").value = data.title || "";

document.getElementById("ip").value = data.ip || "";

document.getElementById("description").value = data.description || "";


}



}

catch(e){

console.log(e);

}


}



loadData();






// ذخیره

document.getElementById("save").onclick = async()=>{


let status = document.getElementById("status");


status.innerHTML="در حال ذخیره...";



try{


await setDoc(

doc(db,"Site","info"),


{


title:
document.getElementById("title").value,


ip:
document.getElementById("ip").value,


description:
document.getElementById("description").value,


updated:
new Date().toISOString()


}


);



status.innerHTML="✅ ذخیره شد";


}


catch(error){


status.innerHTML="❌ خطا در ذخیره";


console.log(error);


}



};



</script>



</body>

</html>
