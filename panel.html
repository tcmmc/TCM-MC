<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<title>TCM Admin Panel</title>

<style>

body{
font-family:tahoma;
direction:rtl;
padding:30px;
background:#111;
color:white;
}

input,textarea{

width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:none;
font-size:16px;

}

button{

padding:12px 25px;
background:#00c853;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}

</style>

</head>


<body>


<h1>👑 پنل مدیریت TCM</h1>


<label>عنوان سایت</label>

<input id="title">


<label>IP سرور</label>

<input id="ip">


<label>توضیحات</label>

<textarea id="description"></textarea>


<button id="save">
ذخیره تغییرات
</button>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

getFirestore,
doc,
setDoc,
getDoc

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyBxhXIVDhXNSisJ0v81ZtdjAZZt9vorNig",

authDomain: "tcm-mc-173a6.firebaseapp.com",

projectId: "tcm-mc-173a6",

storageBucket: "tcm-mc-173a6.firebasestorage.app",

messagingSenderId: "490709082172",

appId: "1:490709082172:web:6ec840d278caef9112a339"

};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);





// گرفتن اطلاعات قبلی


async function loadData(){


try{


const snap = await getDoc(
doc(db,"Site","info")
);



if(snap.exists()){


let data = snap.data();


document.getElementById("title").value =
data.title || "";


document.getElementById("ip").value =
data.ip || "";


document.getElementById("description").value =
data.description || "";



}



}

catch(error){

alert("خطا در دریافت اطلاعات");

console.log(error);

}


}




loadData();







// ذخیره اطلاعات


document.getElementById("save").onclick = async()=>{


let title =
document.getElementById("title").value;


let ip =
document.getElementById("ip").value;


let description =
document.getElementById("description").value;



try{


await setDoc(

doc(db,"Site","info"),

{

title:title,

ip:ip,

description:description

}

);



alert("✅ اطلاعات ذخیره شد");


}


catch(error){


alert("❌ خطا: "+error.message);


console.log(error);


}



};



</script>


</body>

</html>
