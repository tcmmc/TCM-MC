<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>TCM Panel</title>
</head>

<body>

<h1>پنل مدیریت TCM 👑</h1>

<p id="user"></p>

<input id="title" placeholder="عنوان سایت">
<br><br>

<input id="ip" placeholder="IP سرور">
<br><br>

<textarea id="description" placeholder="توضیحات"></textarea>

<br><br>

<button id="save">ذخیره</button>

<button id="logout">خروج</button>


<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyBxhXIVDhXNSisJ0v81ZtdjAZZt9vorNig",

authDomain: "tcm-mc-173a6.firebaseapp.com",

projectId: "tcm-mc-173a6",

storageBucket: "tcm-mc-173a6.firebasestorage.app",

messagingSenderId: "490709082172",

appId: "1:490709082172:web:6ec840d278caef9112a339"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);



let currentUser = null;



onAuthStateChanged(auth, async(user)=>{


if(!user){

window.location.href="admin.html";

return;

}


currentUser=user;

document.getElementById("user").innerHTML =
"ورود موفق: "+user.email;



const snap = await getDoc(
doc(db,"Site","info")
);



if(snap.exists()){

let data=snap.data();

title.value=data.title || "";

ip.value=data.ip || "";

description.value=data.description || "";

}


});





save.onclick = async()=>{


if(!currentUser){

alert("لاگین نیستی");

return;

}


await setDoc(
doc(db,"Site","info"),
{

title:title.value,

ip:ip.value,

description:description.value

}

);


alert("ذخیره شد ✅");


};





logout.onclick=()=>{

signOut(auth);

};


</script>


</body>
</html>
